<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f0e8">
<title>有些话，想认真说完</title>
<style>
:root{--ink:#453b36;--muted:#81736a;--accent:#9b6e62;--paper:#fffdf9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#fffaf4,#f2e9df 80%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.95}
main{width:min(720px,100%);margin:auto;padding:30px 18px 55px}
.eyebrow{text-align:center;color:#9b887b;letter-spacing:.25em;font-size:12px;margin:12px 0 25px}
.card{background:rgba(255,253,249,.94);border:1px solid #e9ded3;border-radius:22px;padding:clamp(24px,6vw,48px);box-shadow:0 18px 55px #73564212}
.kicker{color:var(--accent);font-size:12px;letter-spacing:.18em}
h1{font-size:clamp(27px,6vw,35px);font-weight:500;line-height:1.5;margin:12px 0 16px}
.intro{color:#6e625a;font-size:15px}
button{display:block;width:100%;border:0;border-radius:999px;background:var(--accent);color:white;font-size:15px;padding:14px 18px;margin-top:28px;cursor:pointer}
button:focus-visible{outline:3px solid #c7a79a;outline-offset:3px}
.quiet,.footer{text-align:center;color:#9b8d82;font-size:12px;margin-top:17px}
#letter{display:none;margin-top:18px}
#letter.visible{display:block;animation:fade .55s ease both}
h2{text-align:center;font-size:25px;font-weight:500;margin:8px 0 28px}
.letter p{margin:0 0 19px}
#letterBody .sign{text-align:right;color:#75665e;margin-top:30px}
.sign{text-align:right;color:#75665e;margin-top:30px}
#writingArea{display:none;margin-top:18px}
#writingArea.visible{display:block;animation:fade .55s ease both}
#myWords{display:block;width:100%;min-height:240px;resize:vertical;border:1px solid #e5d8cc;border-radius:14px;background:#fffefa;color:var(--ink);font:inherit;line-height:1.9;padding:15px;outline:none}
#myWords:focus{border-color:#b99486;box-shadow:0 0 0 3px #9b6e621c}
.write-hint{color:var(--muted);font-size:13px;margin:8px 0 0}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#letter.visible{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
<div class="eyebrow">一封迟到的信</div>
<section class="card">
<div class="kicker">给你</div>
<h1>内容很长，不想看就退出吧。</h1>
<p class="intro">我写这些，不是想让你为难，也不是要求你一定要回应。只是有些话，我想认真、平静地说完。你可以选择不点开，也可以随时关掉。</p>
<button id="openBtn" type="button">如果你愿意，就继续看</button>
<p class="quiet">没有倒计时，也没有任何必须完成的事。</p>
</section>
<section class="card" id="letter" aria-live="polite">
<div class="kicker" style="text-align:center">写给你的一封信</div>
<h2>有些话，想认真说完</h2>
<div class="letter" id="letterBody"><p>正在加载信件内容……</p></div>
<button id="writingToggle" type="button">还有些话，我想自己写下来</button>
</div>
</section>
<section class="card" id="writingArea" aria-label="写下自己的话">
<div class="kicker">留给自己的空间</div>
<h2>还有一些话，慢慢写下来</h2>
<textarea id="myWords" placeholder="在这里写下你还想说的话……"></textarea>
<p class="write-hint" id="saveHint">内容只保存在当前浏览器，不会自动发送给任何人。</p>
</section>
<div class="footer">如果不想继续阅读，随时关闭页面就好。</div>
</main>
<script>
document.getElementById('openBtn').addEventListener('click',function(){
const letter=document.getElementById('letter');letter.classList.add('visible');
letter.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
this.textContent='信已展开';this.disabled=true;this.style.opacity='.65';
});
document.getElementById('writingToggle').addEventListener('click',function(){
  const area=document.getElementById('writingArea');
  area.classList.add('visible');
  area.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
  this.textContent='写字区域已展开';
  this.disabled=true;
  this.style.opacity='.65';
});
async function loadLetter(){
  const target=document.getElementById('letterBody');
  try{
    const response=await fetch('content/letter.md?update='+Date.now(),{cache:'no-store'});
    if(!response.ok) throw new Error('无法读取信件内容');
    const source=await response.text();
    const parts=source.split(/^---\\s*$/m);
    let title='有些话，想认真说完';
    let body=source;
    if(parts.length>=3){
      const meta=parts[1];
      const found=meta.match(/^title:\\s*["']?(.*?)["']?\\s*$/m);
      if(found) title=found[1];
      body=parts.slice(2).join('---').trim();
    }
    const escapeHtml=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const inline=s=>escapeHtml(s).replace(/\\*\\*(.+?)\\*\\*/g,'<strong>$1</strong>').replace(/\\*(.+?)\\*/g,'<em>$1</em>');
    const blocks=body.split(/\\n\\s*\\n/).map(s=>s.trim()).filter(Boolean);
    target.innerHTML=blocks.map((block,i)=>{
      const safe=inline(block).replace(/\\n/g,'<br>');
      return i===blocks.length-1 ? '<p class="sign">'+safe+'</p>' : '<p>'+safe+'</p>';
    }).join('');
    const heading=document.querySelector('#letter h2');
    if(heading) heading.textContent=title;
  }catch(error){
    target.innerHTML='<p>暂时无法加载信件内容，请稍后刷新页面。</p>';
  }
}
loadLetter();
const myWords=document.getElementById('myWords');
const saveHint=document.getElementById('saveHint');
try{
  myWords.value=localStorage.getItem('letter-my-words')||'';
  myWords.addEventListener('input',function(){
    try{
      localStorage.setItem('letter-my-words',myWords.value);
      saveHint.textContent='已在当前浏览器自动保存，不会自动发送给任何人。';
    }catch(e){
      saveHint.textContent='当前浏览器无法自动保存，请自行复制备份。';
    }
  });
}catch(e){
  saveHint.textContent='当前浏览器不支持本地保存，请自行复制备份。';
}
</script>
</body>
</html>
