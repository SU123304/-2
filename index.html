<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f0e8">
<title>有些话，想认真说完</title>
<style>
:root{--ink:#33292c;--muted:#827276;--rose:#a85e6a;--rose-dark:#85434f;--paper:#fffdfb;--line:#f0e4e3}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:2;background:radial-gradient(ellipse at 12% 0%,#fff9f3 0,transparent 38%),radial-gradient(ellipse at 95% 32%,#f5e1e5 0,transparent 36%),linear-gradient(145deg,#f9f2ed 0%,#f3e9e9 58%,#faf1eb 100%)}
main{width:min(780px,100%);margin:0 auto;padding:clamp(30px,7vw,66px) 18px 48px}
.eyebrow{text-align:center;color:#9d7f82;letter-spacing:.36em;font-size:10px;margin:0 0 26px}
.card{position:relative;overflow:hidden;background:rgba(255,253,251,.88);border:1px solid rgba(255,255,255,.95);border-radius:26px;padding:clamp(26px,7vw,58px);box-shadow:0 24px 70px rgba(87,49,56,.075),inset 0 1px 0 #fff;backdrop-filter:blur(12px)}
.card:before{content:"";position:absolute;top:0;left:clamp(26px,7vw,58px);right:clamp(26px,7vw,58px);height:1px;background:linear-gradient(90deg,transparent,#e9c9ce,transparent)}
.kicker{color:var(--rose);font-size:10px;letter-spacing:.3em}
h1,h2{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-weight:500}
h1{font-size:clamp(29px,7vw,43px);letter-spacing:.04em;line-height:1.55;margin:17px 0 18px}
.intro{color:#76686c;font-size:15px;line-height:2.15;margin:0}
button{display:block;width:100%;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:linear-gradient(110deg,#ad6872,#8c4b57);color:#fff;font-size:14px;letter-spacing:.08em;padding:15px 20px;margin-top:30px;cursor:pointer;box-shadow:0 9px 24px rgba(143,76,86,.17);transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-2px);box-shadow:0 13px 28px rgba(143,76,86,.24)}
button:focus-visible{outline:3px solid #d9aeb3;outline-offset:4px}
.quiet,.footer{text-align:center;color:#a08e92;font-size:12px;letter-spacing:.025em;margin:17px 0 0}
#letter{display:none;margin-top:20px}
#letter.visible{display:block;animation:fade .6s ease both}
h2{text-align:center;font-size:clamp(23px,5vw,29px);letter-spacing:.08em;line-height:1.6;margin:10px 0 34px}
.letter{font-size:15px;line-height:2.2;color:#514448;overflow-wrap:anywhere}
.letter p{margin:0 0 23px}
#letterBody .sign{display:block;text-align:right;color:#92777c;margin-top:34px}
.footer{padding:8px 12px 0}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:600px){.letter{font-size:16px;line-height:2.25}}
@media(prefers-reduced-motion:reduce){#letter.visible{animation:none}html{scroll-behavior:auto}button{transition:none}}
</style>
</head>
<body>
<main>
<div class="eyebrow">一封迟到的信</div>
<section class="card">
<div class="kicker">给你</div>
<h1>内容很长，不想看就退出吧。</h1>
<p class="intro">我写这些，不是想让你为难，也不是要求你一定要回应。只是有些话，我想认真、平静地说完。你可以选择不点开，也可以随时关掉。</p>
<button id="openBtn" type="button">如果你愿意，就继续看</button>
<p class="quiet">没有倒计时，也没有任何必须完成的事。</p>
</section>
<section class="card" id="letter" aria-live="polite">
<div class="kicker" style="text-align:center">写给你的一封信</div>
<h2>有些话，想认真说完</h2>
<div class="letter" id="letterBody"><p>正在加载信件内容……</p></div>

</div>
</section>

<div class="footer">如果不想继续阅读，随时关闭页面就好。</div>
</main>
<script>
document.getElementById('openBtn').addEventListener('click',function(){
const letter=document.getElementById('letter');letter.classList.add('visible');
letter.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
this.textContent='信已展开';this.disabled=true;this.style.opacity='.65';
});

async function loadLetter(){
  const target=document.getElementById('letterBody');
  try{
    const response=await fetch('content/letter.md?update='+Date.now(),{cache:'no-store'});
    if(!response.ok) throw new Error('无法读取信件内容');
    const source=await response.text();
    const parts=source.split(/^---\s*$/m);
    let title='有些话，想认真说完';
    let body=source;
    if(parts.length>=3){
      const meta=parts[1];
      const found=meta.match(/^title:\s*["']?(.*?)["']?\s*$/m);
      if(found) title=found[1];
      body=parts.slice(2).join('---').trim();
    }
    const escapeHtml=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const inline=s=>escapeHtml(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
    const blocks=body.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
    target.innerHTML=blocks.map((block,i)=>{
      const safe=inline(block).replace(/\n/g,'<br>');
      return i===blocks.length-1 ? '<p class="sign">'+safe+'</p>' : '<p>'+safe+'</p>';
    }).join('');
    const heading=document.querySelector('#letter h2');
    if(heading) heading.textContent=title;
  }catch(error){
    target.innerHTML='<p>暂时无法加载信件内容，请稍后刷新页面。</p>';
  }
}
loadLetter();
</script>
</body>
</html>
