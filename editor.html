<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f0e8"><title>长信编辑室</title>
<style>
:root{--ink:#453b36;--muted:#81736a;--accent:#9b6e62;--paper:#fffdf9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#fffaf4,#f2e9df 80%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}
main{width:min(780px,100%);margin:auto;padding:28px 16px 55px}.eyebrow{text-align:center;color:#9b887b;letter-spacing:.22em;font-size:12px;margin:12px 0 22px}
.card{background:rgba(255,253,249,.96);border:1px solid #e9ded3;border-radius:22px;padding:clamp(22px,5vw,42px);box-shadow:0 18px 55px #73564212;margin-bottom:16px}
h1{font-size:29px;font-weight:500;margin:4px 0 8px}.muted{color:var(--muted);font-size:14px}
label{display:block;font-size:14px;margin:16px 0 6px}input,textarea{display:block;width:100%;border:1px solid #e5d8cc;border-radius:12px;background:#fffefa;color:var(--ink);font:inherit;padding:12px;outline:none}input:focus,textarea:focus{border-color:#b99486;box-shadow:0 0 0 3px #9b6e621c}textarea{min-height:55vh;resize:vertical;line-height:1.95}
button{border:0;border-radius:999px;background:var(--accent);color:white;font-size:15px;padding:12px 20px;cursor:pointer;margin:12px 8px 0 0}button.secondary{background:#e9ded3;color:#59483f}.status{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f7f0e8;font-size:14px;white-space:pre-wrap}.hidden{display:none!important}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}.small{font-size:12px;color:var(--muted)}a{color:var(--accent)}
</style>
</head>
<body><main>
<div class="eyebrow">只属于你的写信空间</div>
<section class="card" id="setupNotice">
<h1>长信编辑室</h1>
<p class="muted">先连接共享存储。设置完成后，你可以在这里输入、修改并保存；公开长信页面会读取最新内容。</p>
<label for="projectUrl">Supabase Project URL</label><input id="projectUrl" type="url" placeholder="https://你的项目编号.supabase.co" autocomplete="url">
<label for="publishableKey">Supabase Publishable / anon key</label><input id="publishableKey" type="text" placeholder="粘贴项目的公开客户端 key" autocomplete="off">
<p class="small">这两项是前端公开配置，不要粘贴 service_role / secret key。</p>
<button id="connectBtn">连接共享存储</button>
<div class="status" id="setupStatus">尚未连接。首次使用需要先按仓库中的 SETUP.md 配置 Supabase。</div>
</section>
<section class="card hidden" id="loginPanel">
<h1>登录编辑</h1><p class="muted">仅使用你在 Supabase 后台创建的账号登录。</p>
<label for="email">邮箱</label><input id="email" type="email" autocomplete="username" placeholder="你的登录邮箱">
<label for="password">密码</label><input id="password" type="password" autocomplete="current-password" placeholder="登录密码">
<button id="loginBtn">登录</button><button class="secondary" id="resetConfigBtn">更换配置</button>
<div class="status" id="loginStatus"></div>
</section>
<section class="card hidden" id="editorPanel">
<div class="toolbar"><div><h1>写下你真正想说的话</h1><div class="muted" id="signedInAs"></div></div><button class="secondary" id="logoutBtn">退出登录</button></div>
<label for="letterTitle">信件标题</label><input id="letterTitle" maxlength="100" placeholder="有些话，想认真说完">
<label for="letterBody">信件正文</label><textarea id="letterBody" placeholder="从这里开始输入。支持直接粘贴你写好的文字。"></textarea>
<div class="toolbar"><span class="small" id="wordCount">0 字</span><span class="small">保存后，公开页面会显示最新内容</span></div>
<button id="saveBtn">保存并发布</button><button class="secondary" id="reloadBtn">重新读取云端内容</button>
<div class="status" id="editorStatus">登录后加载内容。</div>
<p class="small"><a href="./index.html" target="_blank" rel="noopener">打开公开长信页面</a></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
let client=null;
const configKey='letter-editor-supabase-config';
function status(id,msg){$(id).textContent=msg;}
function wordCount(){const n=$('letterBody').value.replace(/\s/g,'').length;$('wordCount').textContent=n+' 字';}
function getConfig(){try{return JSON.parse(localStorage.getItem(configKey)||'{}')}catch(e){return {}}}
function saveConfig(url,key){localStorage.setItem(configKey,JSON.stringify({url:url,key:key}));}
function initClient(){
 if(!window.supabase){status('setupStatus','Supabase 客户端加载失败，请检查网络后刷新。');return false;}
 const saved=getConfig();const url=$('projectUrl').value.trim()||saved.url||'';const key=$('publishableKey').value.trim()||saved.key||'';
 if(!url||!key){status('setupStatus','请填写 Supabase Project URL 和公开客户端 key。');return false;}
 try{client=window.supabase.createClient(url,key);saveConfig(url,key);$('setupNotice').classList.add('hidden');$('loginPanel').classList.remove('hidden');status('loginStatus','配置已保存到当前设备。请用 Supabase 后台创建的账号登录。');return true;}
 catch(e){status('setupStatus','配置格式不正确：'+e.message);return false;}
}
async function loadLetter(){
 status('editorStatus','正在读取云端内容……');
 const {data,error}=await client.from('letter_content').select('title,body').eq('id',1).maybeSingle();
 if(error){status('editorStatus','读取失败：'+error.message+'\n请检查 SETUP.md 中的数据库表和权限设置。');return;}
 $('letterTitle').value=data&&data.title||'有些话，想认真说完';$('letterBody').value=data&&data.body||'';wordCount();
 status('editorStatus',data?'已读取云端最新内容。':'云端还没有内容，写好后点击“保存并发布”。');
}
async function showSession(){
 const {data:{session}}=await client.auth.getSession();
 if(session){$('loginPanel').classList.add('hidden');$('editorPanel').classList.remove('hidden');$('signedInAs').textContent='已登录：'+(session.user.email||'编辑账号');await loadLetter();}
 else{$('editorPanel').classList.add('hidden');$('loginPanel').classList.remove('hidden');}
}
$('connectBtn').addEventListener('click',()=>{if(initClient())showSession();});
$('resetConfigBtn').addEventListener('click',()=>{client=null;$('loginPanel').classList.add('hidden');$('setupNotice').classList.remove('hidden');});
$('loginBtn').addEventListener('click',async()=>{
 if(!client&&!initClient())return;
 const email=$('email').value.trim(),password=$('password').value;
 if(!email||!password){status('loginStatus','请输入邮箱和密码。');return;}
 status('loginStatus','正在登录……');
 const {error}=await client.auth.signInWithPassword({email,password});
 if(error){status('loginStatus','登录失败：'+error.message);return;}
 await showSession();
});
$('saveBtn').addEventListener('click',async()=>{
 const {data:{user}}=await client.auth.getUser();
 if(!user){status('editorStatus','登录状态已失效，请重新登录。');return;}
 status('editorStatus','正在保存……');$('saveBtn').disabled=true;
 const {error}=await client.from('letter_content').upsert({id:1,title:$('letterTitle').value.trim()||'有些话，想认真说完',body:$('letterBody').value,updated_at:new Date().toISOString()});
 $('saveBtn').disabled=false;
 if(error){status('editorStatus','保存失败：'+error.message+'\n请检查数据库策略与登录账号。');return;}
 status('editorStatus','保存成功！公开长信页面刷新后就能看到最新内容。');
});
$('reloadBtn').addEventListener('click',loadLetter);
$('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();$('editorPanel').classList.add('hidden');$('loginPanel').classList.remove('hidden');status('loginStatus','已退出登录。');});
$('letterBody').addEventListener('input',wordCount);
const saved=getConfig();if(saved.url)$('projectUrl').value=saved.url;if(saved.key)$('publishableKey').value=saved.key;
})();
</script>
</body></html>
